name: nestjs-cms
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms_dev_password
      POSTGRES_DB: cms
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 3s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: cms
      MYSQL_USER: cms
      MYSQL_PASSWORD: cms_dev_password
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 40
  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    image: nestjs-cms-minio:2025-10-15
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://localhost:3001
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
  minio-init:
    build:
      context: .
      dockerfile: docker/storage-init.Dockerfile
    depends_on:
      minio: { condition: service_healthy }

volumes:
  postgres-data:
  mysql-data:
  minio-data:
